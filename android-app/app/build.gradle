plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deepseek.dsh.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deepseek.dsh.android'
        minSdk 29
        targetSdk 35
        versionCode 11
        versionName '0.1.5a3'
    }

    // Extract native libs to the filesystem (nativeLibraryDir) so the node
    // binary can be exec'd via ProcessBuilder. AGP 8.x DSL:
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Pure framework APIs only; no AndroidX, no Kotlin.
