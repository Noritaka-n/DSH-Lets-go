plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deepseek.dsh.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deepseek.dsh.android'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.1.4-v5'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
